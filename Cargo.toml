[package]
authors = ["Johan Nielsen <sejr@google.com>"]
name = "hat-backup"
version = "0.0.1-pre"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "hatbin"
path = "src/main.rs"

[dependencies]
byteorder = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["cargo", "env"] }
ciborium = "0.2"
diesel = { version = "2", default-features = false, features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
env_logger = "0.11"
filetime = "0.2"
fuser = { version = "0.15", optional = true }
hex = "0.4"
libc = "0.2"
libsodium-sys = "0.2"
log = "0.4"
lru = "0.12"
quickcheck = "1"
rand = "0.8"
scoped-thread-pool = "1"
secstr = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
void = "1.0.2"

[features]
benchmarks = []
default = []
fuse = ["dep:fuser"]

[lib]
name = "hat"
path = "src/lib.rs"

[profile.release]
debug = true
